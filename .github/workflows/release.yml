name: Release Build

# Builds a signed release APK/AAB. Requires these repository secrets:
#   ZENITH_KEYSTORE_BASE64   base64 of the .jks keystore
#   ZENITH_KEYSTORE_PASSWORD
#   ZENITH_KEY_ALIAS
#   ZENITH_KEY_PASSWORD
# Without them the job builds an unsigned release APK and says so.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew

      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ZENITH_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/zenith-release.jks"
            echo "ZENITH_KEYSTORE_PATH=$RUNNER_TEMP/zenith-release.jks" >> "$GITHUB_ENV"
            echo "Signing keystore configured."
          else
            echo "::warning::No signing secrets configured; the release APK will be unsigned."
          fi

      - name: Test
        run: ./gradlew :core:test :app:testDebugUnitTest

      - name: Build release
        env:
          ZENITH_KEYSTORE_PASSWORD: ${{ secrets.ZENITH_KEYSTORE_PASSWORD }}
          ZENITH_KEY_ALIAS: ${{ secrets.ZENITH_KEY_ALIAS }}
          ZENITH_KEY_PASSWORD: ${{ secrets.ZENITH_KEY_PASSWORD }}
          ZENITH_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/zenith-release.jks"

      - uses: actions/upload-artifact@v7
        with:
          name: zenith-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
