name: Release

# Publishes a signed APK as a GitHub Release on every push to main.
# Share this link — it always downloads the newest version:
#   https://github.com/melhive/ZENITH/releases/latest/download/zenith.apk
#
# Every release is signed with the same key and gets a higher versionCode,
# so Android installs it as an update over the previous version.
# Required repository secrets:
#   ZENITH_KEYSTORE_BASE64, ZENITH_KEYSTORE_PASSWORD, ZENITH_KEY_PASSWORD (key alias: zenith)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # versionCode must always increase; the release run number does that.
      ZENITH_VERSION_CODE: ${{ github.run_number }}
      ZENITH_VERSION_NAME: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew

      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.ZENITH_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Signing secrets are missing. Releases must be signed with the same key so updates install over older versions. See docs/BUILDING.md."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/zenith-release.jks"
          echo "ZENITH_KEYSTORE_PATH=$RUNNER_TEMP/zenith-release.jks" >> "$GITHUB_ENV"

      - name: Test
        run: ./gradlew :core:test :app:testDebugUnitTest

      - name: Build signed release APK
        env:
          ZENITH_KEYSTORE_PASSWORD: ${{ secrets.ZENITH_KEYSTORE_PASSWORD }}
          # The alias is not secret; keeping it out of secrets avoids GitHub masking the word in logs.
          ZENITH_KEY_ALIAS: zenith
          ZENITH_KEY_PASSWORD: ${{ secrets.ZENITH_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/zenith-release.jks"

      - name: Verify signature
        run: |
          ls -la app/build/outputs/apk/release/
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          case "$APK" in *unsigned*) echo "::error::Release APK is unsigned"; exit 1;; esac
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          echo "Using $APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1 | tee verify.txt
          grep -q "Verifies" verify.txt
          cp "$APK" zenith.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${ZENITH_VERSION_NAME}"
          PREV=$(git describe --tags --abbrev=0 2>/dev/null || true)
          {
            echo "## ZENITH ${ZENITH_VERSION_NAME}"
            echo
            echo "**Install / update:** open this link on your Android phone and install:"
            echo "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/zenith.apk"
            echo
            echo "Installs over the previous version (same signing key, versionCode ${ZENITH_VERSION_CODE}). Your data is kept."
            echo
            echo "### Changes"
            if [ -n "$PREV" ]; then git log --pretty='- %s' "$PREV..HEAD"; else git log --pretty='- %s' -n 20; fi
          } > notes.md
          gh release create "$TAG" zenith.apk --title "ZENITH ${ZENITH_VERSION_NAME}" --notes-file notes.md --target "$GITHUB_SHA" --latest
          echo "### Released ${TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo "Download: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/zenith.apk" >> "$GITHUB_STEP_SUMMARY"
